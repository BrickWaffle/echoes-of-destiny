########################################
## CHARACTERS ##########################
########################################
rollFormula = "2d6"
statToggle = false

[rollResults]
  [rollResults.failure]
    range = "6-"
    label = "Complications..."

  [rollResults.partial]
    range = "7-9"
    label = "Partial success"

  [rollResults.success]
    range = "10-11"
    label = "Success!"

  [rollResults.critical]
    range = "12+"
    label = "Critical Success!"

[character]
  [character.stats]
    might = "Might"
    agility = "Agility"
    wits = "Wits"
    presence = "Presence"
    force = "Force"

  [character.attributesTop]
    [character.attributesTop.species]
      type = "Text"

    [character.attributesTop.look]
      type = "Text"

    [character.attributesTop.vice]
      type = "Text"

    [character.attributesTop.xp]
      type = "Xp"
      max = 5

  [character.attributesLeft]
    [character.attributesLeft.condition1]
      type = "Text"
      label = "Conditions"

    [character.attributesLeft.condition2]
      type = "Text"
      label = ""

    [character.attributesLeft.condition3]
      type = "Text"
      label = ""

    [character.attributesLeft.reflections]
      type = "ListMany"
      label = "Reflections"
      description = "Select up to three applicable questions."
      options = [
        "Did you make a meaningful connection with another character?",
        "Did you learn something important about the galaxy?",
        "Did you take a risk or face danger?",
        "Did you pursue your personal goals or beliefs?",
        "Did you create trouble, complications, or consequences?",
        "Did you reveal something significant about your character?"
      ]

    [character.attributesLeft.advancements]
      type = "ListMany"
      label = "Advancements"
      options = [
        "Increase an ability modifier by 1 (max +3)",
        "Increase an ability modifier by 1 (max +3)",
        "Increase an ability modifier by 1 (max +3)",
        "Choose an additional move from your playbook",
        "Choose an additional move from your playbook",
        "Create a custom move for your character",
        "Choose one optional move from another playbook"
      ]

  [character.equipmentTypes]
    gear = "Gear"

  [character.moveTypes]
    basic = "Basic"
    advanced = "Advanced"

########################################
## NPCS ################################
########################################
[npc]
  stats = false

  [npc.attributesTop]

  [npc.equipmentTypes]
    gear = "Gear"

  [npc.moveTypes]
    basic = "Basic"

########################################
## VEHICLES ############################
########################################
[vehicle]
  label = "Vehicle"
  baseType = "npc"

  [vehicle.attributes]
    [vehicle.attributes.condition1]
      type = "Text"
      label = "Condition"
      position = "left"
    [vehicle.attributes.condition2]
      type = "Text"
      label = ""
      position = "left"
    [vehicle.attributes.condition3]
      type = "Text"
      label = ""
      position = "left"

  [vehicle.moveTypes]
    basic = "Basic"

  [vehicle.equipmentTypes]
    cargo = "Cargo"

########################################
## LOCATION ############################
########################################
[location]
  label = "Location"
  baseType = "npc"

  [location.attributes]
    [location.attributes.description]
      type = "LongText"
      label = "Description"
      position = "top"

  [location.moveTypes]
    events = "Location Events"

  [location.equipmentTypes]
    resources = "Resources"

########################################
## ORGANIZATION ########################
########################################
[organization]
  label = "Organization"
  baseType = "character"

  [organization.stats]
    influence = "Influence"
    resources = "Resources"

  [organization.attributes]
    [organization.attributes.reputation]
      type = "Number"
      label = "Reputation"
      position = "top"
    [organization.attributes.agenda]
      type = "LongText"
      label = "Hidden Agenda"
      position = "left"
      limited = true

  [organization.moveTypes]
    political = "Political Moves"
    covert = "Covert Operations"

  [organization.equipmentTypes]
    assets = "Assets"
