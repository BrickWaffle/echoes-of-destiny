name: Validate Compendium Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/compendium-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate source records
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('src/compendium-moves.json', 'utf8'));
          const plays = ['Scoundrel','Ace','Warrior','Operative','Leader','Force User','Diplomat'];
          if (data.basicMoves.length !== 3) throw new Error('Expected 3 basic moves');
          if (data.playbookMoves.length !== 42) throw new Error('Expected 42 playbook moves');
          for (const p of plays) {
            const rows = data.playbookMoves.filter(m => m.playbook === p);
            if (rows.length !== 6) throw new Error(p + ': expected 6 moves, got ' + rows.length);
          }
          const all = [...data.basicMoves, ...data.playbookMoves];
          if (all.some(m => !m.id || !m.name || !m.text)) throw new Error('Missing id/name/text');
          if (new Set(all.map(m => m.id)).size !== all.length) throw new Error('Duplicate source IDs');
          console.log('Validated 3 basic and 42 playbook moves; 7 playbooks × 6.');
          NODE
      - name: Compile and round-trip compendiums
        run: npm run build:packs
      - name: Assemble test-installable module ZIP
        run: |
          mkdir -p dist/echoes-of-destiny
          cp module.json README.md LICENSE dist/echoes-of-destiny/
          cp -R scripts styles packs dist/echoes-of-destiny/
          cd dist
          zip -r ../echoes-of-destiny-test.zip echoes-of-destiny
      - name: Upload test-installable module
        uses: actions/upload-artifact@v4
        with:
          name: echoes-of-destiny-test-module
          path: echoes-of-destiny-test.zip
          if-no-files-found: error
