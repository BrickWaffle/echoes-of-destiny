name: Package Foundry Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set package version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg version "$VERSION" '.version = $version' module.json > module.json.tmp
          mv module.json.tmp module.json
      - name: Stage module folder
        run: |
          mkdir -p dist/echoes-of-destiny
          cp module.json README.md LICENSE dist/echoes-of-destiny/
          cp -R scripts styles dist/echoes-of-destiny/
          cd dist
          zip -r ../echoes-of-destiny.zip echoes-of-destiny
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: echoes-of-destiny.zip
          generate_release_notes: true
